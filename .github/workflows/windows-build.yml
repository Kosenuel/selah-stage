name: Windows build

# Builds an installer you can download and try. Run it by hand from the
# Actions tab ("Run workflow"). The installer is not code-signed, so Windows
# SmartScreen will warn before running it; that is expected until signing is
# set up (see the open questions in CLAUDE.md).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: Installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      # A release build, not a debug one: the audio code needs optimisation to
      # keep up in real time.
      - name: Build the installer
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: selah-stage-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
