[package]
name = "selah-desktop"
description = "The Selah Stage desktop shell: Tauri commands, windows, and wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# Tests for this crate live in `tests/`, not in `#[cfg(test)]` modules. A unit
# test program links Tauri's Windows libraries but gets no app manifest, so
# Windows refuses to start it. `build.rs` attaches one to `tests/` programs.
test = false
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
selah-audio = { workspace = true }
selah-control = { workspace = true }
selah-core = { workspace = true }
selah-engine = { workspace = true }
selah-host = { workspace = true }
selah-library = { workspace = true }
selah-media = { workspace = true }
selah-persist = { workspace = true }

serde = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

# The binding generator is still a release candidate, and its crates must
# match each other exactly. Bump these and `specta-typescript` together.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }

[dev-dependencies]
serde_json = { workspace = true }
specta-typescript = "0.0.15"
