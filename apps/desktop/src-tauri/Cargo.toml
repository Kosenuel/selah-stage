[package]
name = "selah-desktop"
description = "The Selah Stage desktop shell: Tauri commands, windows, and wiring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
selah-audio = { workspace = true }
selah-control = { workspace = true }
selah-core = { workspace = true }
selah-engine = { workspace = true }
selah-library = { workspace = true }
selah-media = { workspace = true }
selah-persist = { workspace = true }

serde = { workspace = true }
tauri = { version = "2", features = [] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

# The binding generator is still a release candidate, and its crates must
# match each other exactly. Bump all three together.
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }

[dev-dependencies]
serde_json = { workspace = true }
